<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f7fb}

.logo{font-size:22px;font-weight:800}.logo span{color:#60a5fa}

.container{padding:14px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;flex-direction:column}

.card-body{padding:10px;flex:1}
.price{color:#2563eb;font-weight:800;margin:4px 0}
.card button{width:100%;padding:8px;border:none;background:#0f172a;color:#fff;border-radius:8px;cursor:pointer}
.cart{position:fixed;right:10px;bottom:10px;background:#0f172a;color:#fff;padding:14px;border-radius:14px;width:300px;max-height:80vh;overflow:auto;display:none;z-index:20}
.admin-panel{background:#fff;margin:14px;padding:14px;border-radius:12px;display:none}
input,textarea{width:100%;padding:8px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
</style>
</head>
